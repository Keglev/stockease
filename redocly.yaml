# Consumed by .github/scripts/docs/build-openapi-docs.sh - `redocly lint`, `redocly bundle` and
# `redocly build-docs` - which the docs check runs from the repository root. That working
# directory is load-bearing: the CLI reads redocly.yaml from the CWD, not from beside the spec and
# not by walking up, so from anywhere else these overrides vanish and an invalid example warns
# instead of failing the build. Moving this file needs an explicit --config at every call site.

extends:
  - recommended

rules:
  # The localhost:8081 entry is the documented local development server, listed
  # deliberately beside production so a reader can run the API locally.
  no-server-example.com: off
  # Health is an anonymous liveness probe with no 4xx by design; it is the one
  # endpoint this rule flags.
  operation-4xx-response: off
  # Examples are executable contract documentation - a reader copies them. Now that
  # they all validate, drift must fail the build rather than accumulate as warnings.
  no-invalid-media-type-examples: error
  no-invalid-schema-examples: error
