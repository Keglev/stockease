name: Deploy Backend

# Releases the backend once Backend Tests has passed on main - the tests are the
# gate, this is the release act. It never builds or pushes an image: Koyeb rebuilds
# from the repository's Dockerfile itself, so all this workflow does is validate
# that file, POST a redeploy to the Koyeb API, take the deployment id out of the
# reply and poll THAT deployment until it ships.
#
# The deployment id rather than the service id, because the service answers HEALTHY
# on behalf of the instance still serving while the new deployment builds beside it -
# see the poll script's header and ADR 042.
#
# Header waived above the five-line rule: every line here is a WHY a reader cannot recover from the steps below.

on:
  workflow_run:
    workflows: ["Backend Tests"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    # The branches filter keeps PR-branch runs of "Backend Tests" from
    # creating stub runs here; this condition remains as defense in depth -
    # only successful non-PR runs may deploy. workflow_dispatch is the
    # manual emergency-deploy path and always runs.
    if: >
      (github.event_name == 'workflow_run'
        && github.event.workflow_run.conclusion == 'success'
        && github.event.workflow_run.event != 'pull_request')
      || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Without this the GitHub default of 360 minutes applies, which is how run
    # 32271377304 was still "in progress" an hour later against 18-19s for every
    # healthy run, until someone cancelled it by hand. The scripts now bound their
    # own requests; this bounds the job even if a step finds a way to hang that
    # they do not cover, so no run can outlive its own budget again.
    #
    # 38 minutes sits just above the poll's worst case: koyeb-wait-healthy.sh gives
    # up on a 2100s (35 minute) wall-clock budget and can be at most one 15s request
    # past it, leaving roughly two and a half minutes for checkout, the Dockerfile
    # check and the redeploy POST.
    #
    # It was 15, sized against a 600s budget that was itself sized against the 18-19s
    # "deploys" - which measured the old instance answering while the new one built,
    # and never timed a build at all. The budget now contains a real one; see the
    # poll script's header.
    timeout-minutes: 38

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Detect project root
        run: bash .github/scripts/shared/detect-maven-project.sh

      - name: Validate Dockerfile
        run: bash .github/scripts/deploy/validate-dockerfile.sh

      - name: Trigger Koyeb redeploy
        id: redeploy
        env:
          KOYEB_API_KEY: ${{ secrets.KOYEB_API_KEY }}
          KOYEB_SERVICE_ID: ${{ secrets.KOYEB_SERVICE_ID }}
        run: bash .github/scripts/deploy/koyeb-redeploy.sh

      # The deployment id, not the service id: the service keeps answering HEALTHY
      # from the instance still serving while the new deployment builds, so watching
      # it passed this gate before the build had started.
      - name: Wait for deployment healthy
        env:
          KOYEB_API_KEY: ${{ secrets.KOYEB_API_KEY }}
          KOYEB_DEPLOYMENT_ID: ${{ steps.redeploy.outputs.deployment_id }}
        run: bash .github/scripts/deploy/koyeb-wait-healthy.sh
