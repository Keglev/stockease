name: Deploy Backend

# Releases the backend once Backend Tests has passed on main - the tests are the
# gate, this is the release act. It never builds or pushes an image: Koyeb rebuilds
# from the repository's Dockerfile itself, so all this workflow does is validate
# that file, POST a redeploy to the Koyeb API and poll until the service reports
# healthy.

on:
  workflow_run:
    workflows: ["Backend Tests"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    # The branches filter keeps PR-branch runs of "Backend Tests" from
    # creating stub runs here; this condition remains as defense in depth -
    # only successful non-PR runs may deploy. workflow_dispatch is the
    # manual emergency-deploy path and always runs.
    if: >
      (github.event_name == 'workflow_run'
        && github.event.workflow_run.conclusion == 'success'
        && github.event.workflow_run.event != 'pull_request')
      || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Without this the GitHub default of 360 minutes applies, which is how run
    # 32271377304 was still "in progress" an hour later against 18-19s for every
    # healthy run, until someone cancelled it by hand. The scripts now bound their
    # own requests; this bounds the job even if a step finds a way to hang that
    # they do not cover, so no run can outlive its own budget again.
    #
    # 15 minutes sits just above the poll's worst case: koyeb-wait-healthy.sh gives
    # up on a 600s wall-clock budget and can be at most one 15s request past it,
    # leaving roughly four minutes for checkout, the Dockerfile check and the
    # redeploy POST. It is a backstop, not a target - a healthy deploy is 18-19s.
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Detect project root
        run: bash .github/scripts/shared/detect-maven-project.sh

      - name: Validate Dockerfile
        run: bash .github/scripts/deploy/validate-dockerfile.sh

      - name: Trigger Koyeb redeploy
        env:
          KOYEB_API_KEY: ${{ secrets.KOYEB_API_KEY }}
          KOYEB_SERVICE_ID: ${{ secrets.KOYEB_SERVICE_ID }}
        run: bash .github/scripts/deploy/koyeb-redeploy.sh

      - name: Wait for service healthy
        env:
          KOYEB_API_KEY: ${{ secrets.KOYEB_API_KEY }}
          KOYEB_SERVICE_ID: ${{ secrets.KOYEB_SERVICE_ID }}
        run: bash .github/scripts/deploy/koyeb-wait-healthy.sh
