name: Docs Pipeline

on:
  workflow_run:
    workflows: ["Backend Tests", "Frontend Tests"]
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/scripts/docs/**'
      - '.github/workflows/docs-pipeline.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: docs-pipeline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-docs:
    # The branches filter keeps PR-branch runs of "Backend Tests" from
    # creating stub runs here; this condition remains as defense in depth -
    # only successful non-PR runs may rebuild the published site.
    if: >
      (github.event_name == 'workflow_run'
        && github.event.workflow_run.conclusion == 'success'
        && github.event.workflow_run.event != 'pull_request')
      || github.event_name != 'workflow_run'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # Each trigger brings a different set of reports, and never all of them:
      #   Backend Tests   -> JaCoCo
      #   Frontend Tests  -> Vitest coverage + the TypeDoc API reference
      #   docs push       -> none of the three
      # A run therefore publishes what its trigger produced and nothing else, and the deploy
      # workflow restores the reports this build did not regenerate. continue-on-error keeps a
      # missing artifact from failing the docs build: the copy steps skip with a notice, and the
      # last published report survives via that same preserve step.
      - name: Download JaCoCo artifact
        if: github.event.workflow_run.name == 'Backend Tests'
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: jacoco-html-${{ github.event.workflow_run.head_sha }}
          path: target/site/jacoco
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Uploaded from frontend/coverage/stockease, whose index.html sits at the artifact root,
      # so this path is already the report root that copy_frontend_coverage expects.
      - name: Download frontend coverage artifact
        if: github.event.workflow_run.name == 'Frontend Tests'
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: frontend-coverage-html-${{ github.event.workflow_run.head_sha }}
          path: target/frontend/coverage
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download frontend API reference artifact
        if: github.event.workflow_run.name == 'Frontend Tests'
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: frontend-api-html-${{ github.event.workflow_run.head_sha }}
          path: target/frontend/api-src
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install ReDoc CLI
        run: npm install -g @redocly/cli

      - name: Install Pandoc
        run: sudo apt-get update -qq && sudo apt-get install -y pandoc

      - name: Build docs site
        run: bash .github/scripts/docs/build-docs.sh .

      - name: Upload docs-site artifact
        uses: actions/upload-artifact@v7
        with:
          name: docs-site
          path: target/docs
