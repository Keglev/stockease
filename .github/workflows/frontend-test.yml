name: Frontend Tests

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-test.yml'
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-test.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    # Same job name as the backend test workflow on purpose: the required
    # branch-protection check matches this name, so whichever side a PR
    # touches, a job with the required name reports on it.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx ng lint

      - name: Type-check and build (production)
        run: npx ng build --configuration production

      - name: Unit tests with coverage
        # Vitest via the Angular builder; --watch=false is the non-interactive mode.
        # Coverage runs in the same pass rather than a second one: the text reporters print the
        # per-directory table and the totals straight into this log. No thresholds are configured,
        # so coverage reports numbers and never fails the build - gating is a later decision.
        run: npm run test:coverage

      - name: Upload coverage report
        # Uploaded on every run, pull requests included: the HTML report is the point of this step,
        # and a reviewer needs it on the PR that changes the numbers. Deliberately not wired into
        # the docs pipeline - publishing to the docs site lands with the frontend docs bundle.
        # always(): a failing suite still produces a report, and that is when it is most useful.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage-html-${{ github.sha }}
          path: frontend/coverage/stockease
          overwrite: true
