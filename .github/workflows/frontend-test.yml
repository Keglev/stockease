name: Frontend Tests

# Gates frontend changes under the same required build-and-test name the backend suite
# reports, so a PR touching only frontend/ still produces the check branch protection
# demands. It also builds the two artifacts the docs site publishes - Vitest coverage and
# the TypeDoc reference, which needs this workflow's node_modules - and its success on
# main triggers Deploy Frontend.

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-test.yml'
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-test.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    # Same job name as the backend test workflow on purpose: the required
    # branch-protection check matches this name, so whichever side a PR
    # touches, a job with the required name reports on it.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx ng lint

      - name: Check i18n bundles match their sources
        # The two files under public/i18n are assembled artifacts, not authored ones: the
        # sources are one file per namespace under src/i18n (ADR 037). Both stay committed,
        # so nothing at runtime depends on a build step - which is exactly what lets them
        # drift. This step re-assembles and refuses any difference, making a hand-edit to a
        # shipped bundle impossible to merge. Before the build so a mismatch fails fast.
        run: npm run i18n:check

      - name: Type-check and build (production)
        run: npx ng build --configuration production

      - name: Unit tests with coverage
        # Vitest via the Angular builder; --watch=false is the non-interactive mode.
        # Coverage runs in the same pass rather than a second one: the text reporters print the
        # per-directory table and the totals straight into this log. No thresholds are configured,
        # so coverage reports numbers and never fails the build - gating is a later decision.
        run: npm run test:coverage

      - name: Upload coverage report
        # Uploaded on every run, pull requests included: the HTML report is the point of this step,
        # and a reviewer needs it on the PR that changes the numbers. The docs pipeline downloads
        # this artifact on runs it triggers and publishes it at /stockease/frontend/coverage.
        # always(): a failing suite still produces a report, and that is when it is most useful.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage-html-${{ github.sha }}
          path: frontend/coverage/stockease
          overwrite: true

      - name: Generate API reference (TypeDoc)
        # Generated here rather than in the docs pipeline because TypeDoc needs the frontend's
        # installed node_modules, which only this workflow has. Settings live in typedoc.json.
        run: bash ../.github/scripts/docs/build-frontend-api.sh ..

      - name: Upload API reference
        # Success only, unlike the coverage upload above: a reference built from a tree that
        # failed to compile or lint is not something to publish over the last good one. Coverage
        # keeps always() because a failing suite's numbers are exactly what a reviewer wants.
        uses: actions/upload-artifact@v7
        with:
          name: frontend-api-html-${{ github.sha }}
          path: frontend/typedoc-dist
          overwrite: true
