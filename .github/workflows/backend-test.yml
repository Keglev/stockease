name: Backend Tests

on:
  schedule:
    - cron: '0 6 1,15 * *'  # rebuild every two weeks to pick up patched base images
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '.gitignore'
      - 'README.md'
      - 'frontend/**'
      - '.github/scripts/docs/**'
      - '.github/workflows/docs-pipeline.yml'
  pull_request:
    branches: [main]
    # frontend/** is the ONLY legal entry here: frontend PRs get the
    # required build-and-test check from frontend-test.yml. Ignoring
    # anything else (docs/**, README) would leave those PRs with NO
    # check named build-and-test and permanently blocked from merging.
    paths-ignore:
      - 'frontend/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Detect project root
        run: bash .github/scripts/shared/detect-maven-project.sh

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Make mvnw executable
        run: chmod +x "$PROJECT_DIR/mvnw"

      - name: Run tests
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./mvnw -B -ntp test

      - name: Upload coverage report
        # Consumed by the docs pipeline via workflow_run; PR runs publish nothing.
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-html-${{ github.sha }}
          path: ${{ env.PROJECT_DIR }}/target/site/jacoco
          overwrite: true

      - name: Build and verify
        working-directory: ${{ env.PROJECT_DIR }}
        # -DskipTests: tests already ran in previous step
        # -Dspringdoc.skip=true: skips OpenAPI doc generation at build time
        run: ./mvnw -B -ntp -DskipTests -Dspringdoc.skip=true verify
