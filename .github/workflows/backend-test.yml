name: Backend Tests

# The repository's primary merge gate: this file's job carries the build-and-test
# name branch protection requires, and every path not claimed by the frontend or
# docs workflows falls through to it. Its success on main is also what starts the
# release chain - Deploy Backend waits on this workflow, and the JaCoCo artifact
# uploaded here is what lets Docs Pipeline publish current coverage.

on:
  schedule:
    - cron: '0 6 1,15 * *'  # rebuild every two weeks to pick up patched base images
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '.gitignore'
      - 'README.md'
      - 'frontend/**'
      - '.github/scripts/docs/**'
      - '.github/workflows/docs-pipeline.yml'
      - 'lychee.toml'
  pull_request:
    branches: [main]
    # A path may be ignored here ONLY if another workflow gives that PR a
    # check named build-and-test - the required one. A path ignored by
    # every workflow leaves its PRs with no such check and permanently
    # blocked from merging, so this list is not a matter of taste.
    #
    # Two workflows earn entries. frontend/** is covered by
    # frontend-test.yml. The four docs paths are covered by
    # docs-pr-check.yml, which builds the site and checks its links; they
    # are exactly that workflow's trigger paths and must stay in step with
    # them. Everything else falls through to this job - including
    # README.md and .gitignore, which deliberately stay here rather than
    # joining the docs list: they are outside docs/, so the docs build
    # never reads them and would gate them on nothing.
    #
    # docs-pr-check.yml's own file is deliberately absent below, so editing
    # the docs gate runs the backend suite as well as the docs one.
    paths-ignore:
      - 'frontend/**'
      - 'docs/**'
      - '.github/scripts/docs/**'
      - '.github/workflows/docs-pipeline.yml'
      - 'lychee.toml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Detect project root
        run: bash .github/scripts/shared/detect-maven-project.sh

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Make mvnw executable
        run: chmod +x "$PROJECT_DIR/mvnw"

      - name: Run tests
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./mvnw -B -ntp test

      - name: Upload coverage report
        # Consumed by the docs pipeline via workflow_run; PR runs publish nothing.
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-html-${{ github.sha }}
          path: ${{ env.PROJECT_DIR }}/target/site/jacoco
          overwrite: true

      - name: Build and verify
        working-directory: ${{ env.PROJECT_DIR }}
        # -DskipTests: tests already ran in previous step
        # -Dspringdoc.skip=true: skips OpenAPI doc generation at build time
        run: ./mvnw -B -ntp -DskipTests -Dspringdoc.skip=true verify
