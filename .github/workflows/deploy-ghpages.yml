name: Deploy Docs to GitHub Pages

# Publishes the static documentation site to the gh-pages branch. It builds
# nothing of its own: docs-pipeline.yml does the building, and this workflow runs
# after that one succeeds and publishes the docs-site artifact it produced.

on:
  workflow_run:
    workflows: ["Docs Pipeline"]
    types: [completed]
  # A workflow_run event always executes the default branch's copy of this file, so a
  # change to it can only be exercised through a manual dispatch. The trigger stays as
  # a standing republish path, consistent with the dispatch-over-rerun practice.
  workflow_dispatch:
    inputs:
      run_id:
        description: "Docs Pipeline run id whose docs-site artifact to publish"
        required: true

permissions:
  contents: write
  actions: read

# Prevent concurrent gh-pages pushes — parallel runs cause branch merge conflicts
concurrency:
  group: ghpages-deploy
  cancel-in-progress: false

jobs:
  deploy-ghpages:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout gh-pages branch
        uses: actions/checkout@v7
        with:
          ref: gh-pages
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      # The job's worktree is the gh-pages branch, which carries only the published site —
      # repository scripts are never in it. Omitting `ref` is deliberate: it resolves to
      # github.sha, which is main's head under workflow_run and the dispatched ref's head
      # under workflow_dispatch, so production publishes with main's scripts and branch
      # verification with the branch's, without a conditional.
      - name: Fetch deploy scripts
        uses: actions/checkout@v7
        with:
          path: .ci-scripts

      # Staging the scripts outside the worktree leaves the gh-pages tree exactly as the sync
      # script expects: its wipe exclusion list stays untouched, and no helper directory can
      # be swept into the publish commit.
      - name: Stage deploy scripts outside the worktree
        run: |
          cp -R .ci-scripts/.github/scripts/deploy "$RUNNER_TEMP/deploy"
          rm -rf .ci-scripts

      - name: Download docs-site artifact
        uses: actions/download-artifact@v8
        with:
          name: docs-site
          path: docs-site
          run-id: ${{ github.event.workflow_run.id || inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync docs-site into gh-pages root
        run: bash "$RUNNER_TEMP/deploy/ghpages-sync-site.sh"

      - name: Opt gh-pages out of Vercel deployments
        run: |
          # Vercel's Git integration deploys every pushed branch; this branch
          # is the published docs site, not an app. The config is read from
          # the pushed commit, and this branch is regenerated on every
          # publish, so the opt-out must be planted here each run.
          echo '{ "git": { "deploymentEnabled": false } }' > vercel.json
          mkdir -p frontend
          cp vercel.json frontend/vercel.json

      - name: Inject back-to-docs link into coverage report
        run: bash "$RUNNER_TEMP/deploy/ghpages-inject-backlink.sh"

      - name: Commit and push to gh-pages
        run: bash "$RUNNER_TEMP/deploy/ghpages-publish.sh"
        env:
          RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}

      - name: Job summary
        if: always()
        run: |
          echo "## GitHub Pages Deployment" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** \`gh-pages\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Site:** https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/" >> $GITHUB_STEP_SUMMARY
