parameters:
  - name: id
    in: path
    required: true
    schema:
      type: integer
      format: int64
    description: Customer identifier

get:
  summary: Get a customer by ID
  description: |
    Provided for API completeness; the bundled UI reads this resource through its list endpoints.
  operationId: getCustomerById
  tags:
    - Customers
  security:
    - BearerAuth: []
  responses:
    '200':
      description: Customer found (ROLE_USER or ROLE_ADMIN)
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/ApiResponseCustomer'
          example:
            success: true
            message: Customer fetched successfully
            data:
              id: 9
              name: Jane Doe
              email: jane@example.com
              phone: 555-1234
              address: 1 Main St
              city: Springfield
              createdAt: '2026-01-02T03:04:00'
    '401':
      $ref: '../openapi.yaml#/components/responses/Unauthorized'
    '404':
      description: No customer with that ID
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/ApiResponseError'
          example:
            success: false
            message: 'Entity not found: Customer with ID 9 not found.'
            data: null

put:
  summary: Replace a customer's details
  description: |
    Every field is replaced wholesale. Only the name is mandatory - the same rule creation applies,
    not the supplier's mandatory address - and omitting an optional contact field clears the stored
    value rather than leaving it untouched.

    Renaming a customer does not rewrite invoices already issued to them: an invoice states the
    party it was issued under (ADR 033). Walk-in sales carry no customer record at all, so they are
    unaffected either way.

    The request shape is `CreateCustomerRequest`, reused rather than duplicated: creation and
    replacement take the same five fields under the same rules.
  operationId: updateCustomer
  tags:
    - Customers
  security:
    - BearerAuth: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../openapi.yaml#/components/schemas/CreateCustomerRequest'
  responses:
    '200':
      description: Customer updated (ROLE_USER or ROLE_ADMIN)
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/ApiResponseCustomer'
          example:
            success: true
            message: Customer updated successfully
            data:
              id: 9
              name: Jane Roe
              email: roe@example.com
              phone: 555-9999
              address: 2 Side St
              city: Shelbyville
              createdAt: '2026-01-02T03:04:00'
    '400':
      $ref: '../openapi.yaml#/components/responses/ValidationError'
    '401':
      $ref: '../openapi.yaml#/components/responses/Unauthorized'
    '404':
      description: No customer with that ID
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/ApiResponseError'
          example:
            success: false
            message: 'Entity not found: Customer with ID 9 not found.'
            data: null

delete:
  summary: Soft-delete a customer (ADMIN only)
  description: |
    Soft-deletes the customer. The invoice module vetoes the deletion while any open sale invoice
    still names this customer, which surfaces as 409 and rolls the whole transaction back.
  operationId: deleteCustomer
  tags:
    - Customers
  security:
    - BearerAuth: []
  responses:
    '200':
      description: Customer deleted
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/ApiResponseString'
          example:
            success: true
            message: Customer with ID 1 has been successfully deleted.
            data: null
    '401':
      $ref: '../openapi.yaml#/components/responses/Unauthorized'
    '403':
      $ref: '../openapi.yaml#/components/responses/Forbidden'
    '404':
      description: No customer with that ID
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/ApiResponseError'
          example:
            success: false
            message: 'Entity not found: Customer with ID 9 not found.'
            data: null
    '409':
      description: Deletion vetoed - open invoices still reference the customer
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/ApiResponseError'
          example:
            success: false
            message: "Cannot delete customer 'Jane Doe': open invoices exist."
            data: null
