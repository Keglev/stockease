parameters:
  - name: id
    in: path
    required: true
    schema:
      type: integer
      format: int64
    description: Invoice identifier

get:
  summary: Get one invoice in full
  description: |
    Returns the invoice with its lines, each line's product name, and both counterparty names. The
    query fetch-joins everything the response maps, so the detail shape costs a single round trip.
  operationId: getInvoiceById
  tags:
    - Invoices
  security:
    - BearerAuth: []
  responses:
    '200':
      description: Invoice found (ROLE_USER or ROLE_ADMIN)
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/ApiResponseInvoice'
          example:
            success: true
            message: Invoice fetched successfully
            data:
              id: 1
              invoiceNumber: RE-2026-0117
              type: PURCHASE
              status: CLOSED
              dueDate: '2026-03-01'
              supplierId: 7
              supplierName: Acme
              customerId: null
              customerName: null
              closedAt: '2026-01-03T09:00:00'
              paidAt: null
              createdAt: '2026-01-02T03:04:00'
              items:
                - id: 4
                  productId: 3
                  productName: Widget
                  quantity: 2
                  unitPrice: 15.00
                  returnedQty: 0
    '401':
      $ref: '../openapi.yaml#/components/responses/Unauthorized'
    '404':
      description: No invoice with that ID
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/ApiResponseError'
          example:
            success: false
            message: 'Entity not found: Invoice with ID 9 not found.'
            data: null

delete:
  summary: Delete an open invoice (ADMIN only)
  description: |
    Soft-deletes an invoice that is still OPEN. Once an invoice is closed it has booked stock
    movements, so deleting it is refused with 409.
  operationId: deleteInvoice
  tags:
    - Invoices
  security:
    - BearerAuth: []
  responses:
    '200':
      description: Invoice deleted
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/ApiResponseString'
          example:
            success: true
            message: Invoice with ID 1 has been successfully deleted.
            data: null
    '401':
      $ref: '../openapi.yaml#/components/responses/Unauthorized'
    '403':
      $ref: '../openapi.yaml#/components/responses/Forbidden'
    '404':
      description: No invoice with that ID
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/ApiResponseError'
          example:
            success: false
            message: 'Entity not found: Invoice with ID 9 not found.'
            data: null
    '409':
      description: The invoice is not open
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/ApiResponseError'
          example:
            success: false
            message: Only open invoices can be deleted.
            data: null
