parameters:
  - name: id
    in: path
    required: true
    schema:
      type: integer
      format: int64
    description: Product identifier

get:
  summary: Gross profit for one product
  description: |
    Cost is cost of goods sold, so stock bought but not yet sold does not reduce profit.
    `from` and `to` optionally restrict the report to movements booked in that closed date range.
  operationId: profitForProduct
  tags:
    - Reports
  security:
    - BearerAuth: []
  parameters:
    - name: from
      in: query
      required: false
      schema:
        type: string
        format: date
      description: First booking date to count; omit for no lower bound
      example: '2026-01-01'
    - name: to
      in: query
      required: false
      schema:
        type: string
        format: date
      description: Last booking date to count, inclusive; omit for no upper bound
      example: '2026-03-31'
  responses:
    '200':
      description: Report retrieved (ROLE_USER or ROLE_ADMIN)
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/ApiResponseProductProfit'
          example:
            success: true
            message: Product profit fetched successfully
            data:
              productId: 3
              name: Widget
              sku: SKU-3
              deleted: false
              revenue: 100.00
              cost: 40.00
              grossProfit: 60.00
    '400':
      description: The start of the period is after its end
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/ApiResponseError'
          example:
            success: false
            message: The start of the period must not be after its end.
            data: null
    '401':
      $ref: '../openapi.yaml#/components/responses/Unauthorized'
    '404':
      description: No such product
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/ApiResponseError'
          example:
            success: false
            message: 'Entity not found: No profit report for product with ID 9.'
            data: null
