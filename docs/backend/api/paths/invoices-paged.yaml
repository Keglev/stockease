get:
  summary: Retrieve invoices with pagination
  description: |
    Returns a paginated slice of the invoice ledger with metadata, newest first. Same rows, order
    and soft-delete filtering as the unpaged listing - only sliced.

    Prefer this over the unpaged endpoint for anything user-facing: the ledger is the one list here
    that grows without bound. Default page size is 10.
  operationId: getPagedInvoices
  tags:
    - Invoices
  security:
    - BearerAuth: []
  parameters:
    - name: page
      in: query
      required: false
      description: Zero-based page number (default 0)
      schema:
        type: integer
        minimum: 0
        default: 0
        example: 0
    - name: size
      in: query
      required: false
      description: Items per page (default 10, must be positive)
      schema:
        type: integer
        minimum: 1
        default: 10
        example: 10
  responses:
    '200':
      description: Paginated invoices returned (ROLE_USER or ROLE_ADMIN)
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/ApiResponsePaginatedInvoices'
          example:
            success: true
            message: Paged invoices fetched successfully
            data:
              content:
                - id: 1
                  invoiceNumber: RE-2026-0117
                  type: PURCHASE
                  status: CLOSED
                  dueDate: '2026-03-01'
                  supplierId: 7
                  supplierName: Acme
                  customerId: null
                  customerName: null
                  closedAt: '2026-01-02T03:04:00'
                  paidAt: null
                  createdAt: '2026-01-02T03:04:00'
              pageNumber: 0
              pageSize: 10
              totalElements: 100
              totalPages: 10
    '400':
      description: |
        Invalid pagination parameters - a negative page or a non-positive size. Reported by the
        handler-method validation path, whose error key is not deterministic.
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/ValidationErrorResponse'
          example:
            success: false
            message: Validation failed for request parameters.
            data:
              Unknown: Unable to extract detailed validation error.
    '401':
      $ref: '../openapi.yaml#/components/responses/Unauthorized'
