get:
  summary: Gross profit per supplier
  description: |
    One row per supplier that has supplied at least one product, ordered by supplier ID.
    Documented simplification: a product purchased from several suppliers counts fully for each of
    them - this is a gross profit model with no per-supplier cost allocation.
  operationId: profitPerSupplier
  tags:
    - Reports
  security:
    - BearerAuth: []
  responses:
    '200':
      description: Report retrieved (ROLE_USER or ROLE_ADMIN)
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '../openapi.yaml#/components/schemas/SupplierProfitReport'
          example:
            - supplierId: 7
              name: Acme
              revenue: 100.00
              cost: 40.00
              grossProfit: 60.00
    '401':
      $ref: '../openapi.yaml#/components/responses/Unauthorized'
