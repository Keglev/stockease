get:
  summary: List all suppliers
  description: |
    Returns every live supplier. Soft-deleted suppliers are excluded.
  operationId: getAllSuppliers
  tags:
    - Suppliers
  security:
    - BearerAuth: []
  responses:
    '200':
      description: Suppliers retrieved (ROLE_USER or ROLE_ADMIN)
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '../openapi.yaml#/components/schemas/SupplierResponse'
          example:
            - id: 7
              name: Acme
              address: 1 Main St
              createdAt: '2026-01-02T03:04:00'
    '401':
      $ref: '../openapi.yaml#/components/responses/Unauthorized'

post:
  summary: Create a supplier
  description: |
    Creates a supplier. Both fields are mandatory and rejected when blank, at the request layer and
    again in the service.
  operationId: createSupplier
  tags:
    - Suppliers
  security:
    - BearerAuth: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../openapi.yaml#/components/schemas/SupplierRequest'
  responses:
    '200':
      description: Supplier created (ROLE_USER or ROLE_ADMIN); returns the bare record
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/SupplierResponse'
          example:
            id: 7
            name: Acme
            address: 1 Main St
            createdAt: '2026-01-02T03:04:00'
    '400':
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/ValidationErrorResponse'
          example:
            success: false
            message: Validation failed for request parameters.
            data:
              name: Supplier name is required.
    '401':
      $ref: '../openapi.yaml#/components/responses/Unauthorized'
