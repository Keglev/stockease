post:
  summary: Restore a soft-deleted product (ADMIN only)
  description: |
    Clears the soft-delete stamp so the product answers ordinary product queries again, and records a
    `RESTORED` entry in the change log against the calling user. Restoring is not destructive and the
    UI offers it without a confirmation step.

    Product names and SKUs are unique among live rows only, so a deleted product's name or SKU can be
    claimed by a new product while it sits in the bin. When that has happened the restore is refused
    with 409 and the product stays deleted - no change-log entry is written. Resolving the collision
    means renaming or re-SKU-ing the live product first. The service checks both attributes for a
    friendly message; the partial unique indexes on the table are the concurrency backstop.

    The 404 covers two cases that are deliberately indistinguishable to the caller: no product carries
    that ID at all, and the product exists but is already live. Neither is a soft-deleted product that
    could be restored.
  operationId: restoreProduct
  tags:
    - Products
  security:
    - BearerAuth: []
  parameters:
    - name: id
      in: path
      required: true
      description: Identifier of the soft-deleted product to restore
      schema:
        type: integer
        format: int64
        example: 1
  responses:
    '200':
      description: Product restored and now live
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/ApiResponseProduct'
          example:
            success: true
            message: Product restored successfully
            data:
              id: 1
              name: Laptop
              sku: SKU-A1B2C3D4
              quantity: 50
              purchasePrice: 999.99
              totalValue: 49999.50
              createdAt: '2026-01-02T03:04:00'
    '401':
      $ref: '../openapi.yaml#/components/responses/Unauthorized'
    '403':
      $ref: '../openapi.yaml#/components/responses/Forbidden'
    '404':
      description: |
        No soft-deleted product carries that ID - either it does not exist or it is already live.
        Raised through the shared handler, so the message carries the `Entity not found: ` prefix.
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/ApiResponseError'
          example:
            success: false
            message: 'Entity not found: No soft-deleted product with ID 999 found.'
            data: null
    '409':
      description: |
        A live product already carries the deleted product's name or SKU. The product remains
        deleted and no change-log entry is written.
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/ApiResponseError'
          examples:
            nameTaken:
              summary: Name claimed by a live product
              value:
                success: false
                message: "Cannot restore: a live product named 'Laptop' already exists."
                data: null
            skuTaken:
              summary: SKU claimed by a live product
              value:
                success: false
                message: "Cannot restore: a live product with SKU 'SKU-A1B2C3D4' already exists."
                data: null
