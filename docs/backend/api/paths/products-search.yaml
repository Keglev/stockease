get:
  summary: Search products by name
  description: |
    Case-insensitive substring search. For example, searching "apple" returns products like
    "Apple Juice", "APPLE", "Green Apple", etc.
    Returns 204 NO_CONTENT when nothing matches.
  operationId: searchProductsByName
  tags:
    - Products
  security:
    - BearerAuth: []
  parameters:
    - name: name
      in: query
      required: true
      description: Search term (substring, case-insensitive)
      schema:
        type: string
        example: laptop
  responses:
    '200':
      description: Matching products found
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/ProductList'
          example:
            - id: 1
              name: Laptop
              sku: SKU-A1B2C3D4
              quantity: 50
              purchasePrice: 999.99
              totalValue: 49999.50
              createdAt: '2026-01-02T03:04:00'
    '204':
      description: |
        No matching products found.
        Note: despite using HTTP 204, this response includes a body (unconventional by HTTP spec).
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/MessageOnly'
          example:
            message: 'No products found matching the name: laptop'
    '401':
      $ref: '../openapi.yaml#/components/responses/Unauthorized'
