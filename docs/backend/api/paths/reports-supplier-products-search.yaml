parameters:
  - name: id
    in: path
    required: true
    schema:
      type: integer
      format: int64
    description: Supplier identifier

get:
  summary: Search the products one supplier has sold this business
  description: |
    Token search over the distinct products reachable from that supplier's non-deleted, closed
    purchase invoices. There is no supplier column on a product: a product is a supplier's because
    that supplier was invoiced for it, and since stock enters only through closed purchase invoices
    (ADR 021), every stocked product is reachable this way.

    `name` is split on whitespace and **every** token must match, case-insensitively, as a substring
    of the product's name **or** its SKU, in any order - the same rule
    `GET /api/products/search` applies, because a reader has no way to tell which of the two pickers
    on a screen is the scoped one and both must answer alike.

    A **blank or whitespace-only `name` matches everything this supplier has sold** and returns the
    first 20 of them alphabetically. Browsing stays scoped: it is this supplier's catalogue, never
    the whole one. This is what the client's picker shows when focused and empty, and it is the case
    ADR 035 was written for - a picker with a supplier already chosen that rendered nothing until
    typed into read as broken.

    A product bought from two suppliers answers under both. That is correct rather than a duplicate
    to resolve - both suppliers really did sell it to us - and repeat purchases of one product from
    one supplier collapse to a single entry, which is what makes this a picker rather than a
    purchase history.

    Results are alphabetical and capped at 20, and soft-deleted products are excluded, matching the
    supplier typeahead. Nothing matching returns **200 with an empty array**; only an unknown or
    retired supplier yields 404. ADR 028 records why this diverged from the older
    `GET /api/products/search`, which 2.16.0 corrected to the same contract.

    The path sits under `/api/reports` rather than under the supplier API because the aggregation is
    the reporting module's - the linkage is drawn through the purchase ledger, which the supplier
    module cannot read - even though what it describes is a supplier's catalogue. The same reasoning
    placed the customer summary here.

    **Changed in 2.22.0.** Matching was previously one case-insensitive substring test against the
    product name alone. Every term that matched before still matches. ADR 035 records the change.
  operationId: supplierProducts
  tags:
    - Reports
  security:
    - BearerAuth: []
  parameters:
    - name: name
      in: query
      required: true
      description: >
        Search term. Split on whitespace; every token must match the name or the SKU,
        case-insensitively, in any order. Blank browses this supplier's first capped page.
      schema:
        type: string
        example: dru pap
  responses:
    '200':
      description: The supplier's matching products, empty if none match (ROLE_USER or ROLE_ADMIN)
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '../openapi.yaml#/components/schemas/SupplierProduct'
          example:
            - id: 1
              name: Laptop
              sku: SKU-A1B2C3D4
              quantity: 50
              purchasePrice: 999.99
              totalValue: 49999.50
              createdAt: '2026-01-02T03:04:00'
    '401':
      $ref: '../openapi.yaml#/components/responses/Unauthorized'
    '404':
      description: No live supplier with that ID
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/ApiResponseError'
          example:
            success: false
            message: 'Entity not found: Supplier with ID 999 not found.'
            data: null
