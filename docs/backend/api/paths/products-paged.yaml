get:
  summary: Retrieve products with pagination
  description: |
    Returns a paginated product list with metadata, so the whole table never has to be loaded.
    Default page size is 10.
  operationId: getPagedProducts
  tags:
    - Products
  security:
    - BearerAuth: []
  parameters:
    - name: page
      in: query
      required: false
      description: Zero-based page number (default 0)
      schema:
        type: integer
        minimum: 0
        default: 0
        example: 0
    - name: size
      in: query
      required: false
      description: Items per page (default 10, must be positive)
      schema:
        type: integer
        minimum: 1
        default: 10
        example: 10
  responses:
    '200':
      description: Paginated products returned (ROLE_USER or ROLE_ADMIN)
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/ApiResponsePaginated'
          example:
            success: true
            message: Paged products fetched successfully
            data:
              content:
                - id: 1
                  name: Laptop
                  sku: SKU-A1B2C3D4
                  quantity: 50
                  purchasePrice: 999.99
                  totalValue: 49999.50
                  createdAt: '2026-01-02T03:04:00'
              pageNumber: 0
              pageSize: 10
              totalElements: 100
              totalPages: 10
    '400':
      description: |
        Invalid pagination parameters - a negative page or a non-positive size. Reported by the
        handler-method validation path, whose error key is not deterministic.
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/ValidationErrorResponse'
          example:
            success: false
            message: Validation failed for request parameters.
            data:
              Unknown: Unable to extract detailed validation error.
    '401':
      $ref: '../openapi.yaml#/components/responses/Unauthorized'
