get:
  summary: Calculate total inventory value
  description: |
    Sums quantity times purchase price across all products with a single database aggregate, so the
    figure never depends on loading the catalogue into memory.
  operationId: getTotalStockValue
  tags:
    - Products
  security:
    - BearerAuth: []
  responses:
    '200':
      description: Total stock value calculated (ROLE_USER or ROLE_ADMIN)
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/ApiResponseDouble'
          example:
            success: true
            message: Total stock value fetched successfully
            data: 99999.99
    '401':
      $ref: '../openapi.yaml#/components/responses/Unauthorized'
