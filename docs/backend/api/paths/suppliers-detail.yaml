parameters:
  - name: id
    in: path
    required: true
    schema:
      type: integer
      format: int64
    description: Supplier identifier

get:
  summary: Get a supplier by ID
  description: |
    Provided for API completeness; the bundled UI reads this resource through its list endpoints.
  operationId: getSupplierById
  tags:
    - Suppliers
  security:
    - BearerAuth: []
  responses:
    '200':
      description: Supplier found (ROLE_USER or ROLE_ADMIN)
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/ApiResponseSupplier'
          example:
            success: true
            message: Supplier fetched successfully
            data:
              id: 7
              name: Acme
              email: acme@example.com
              phone: 555-1234
              address: 1 Main St
              city: Springfield
              createdAt: '2026-01-02T03:04:00'
    '401':
      $ref: '../openapi.yaml#/components/responses/Unauthorized'
    '404':
      description: No supplier with that ID
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/ApiResponseError'
          example:
            success: false
            message: 'Entity not found: Supplier with ID 9 not found.'
            data: null

put:
  summary: Replace a supplier's details
  description: |
    Every field is replaced wholesale. Name and address are mandatory; omitting an optional contact
    field clears the stored value rather than leaving it untouched.
  operationId: updateSupplier
  tags:
    - Suppliers
  security:
    - BearerAuth: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../openapi.yaml#/components/schemas/SupplierRequest'
  responses:
    '200':
      description: Supplier updated (ROLE_USER or ROLE_ADMIN)
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/ApiResponseSupplier'
          example:
            success: true
            message: Supplier updated successfully
            data:
              id: 7
              name: Acme Two
              email: two@example.com
              phone: 555-9999
              address: 2 Side St
              city: Shelbyville
              createdAt: '2026-01-02T03:04:00'
    '400':
      $ref: '../openapi.yaml#/components/responses/ValidationError'
    '401':
      $ref: '../openapi.yaml#/components/responses/Unauthorized'
    '404':
      description: No supplier with that ID
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/ApiResponseError'
          example:
            success: false
            message: 'Entity not found: Supplier with ID 9 not found.'
            data: null

delete:
  summary: Soft-delete a supplier (ADMIN only)
  description: |
    Soft-deletes the supplier. The invoice module vetoes the deletion while any open invoice still
    names this supplier, which surfaces as 409 and rolls the whole transaction back.
  operationId: deleteSupplier
  tags:
    - Suppliers
  security:
    - BearerAuth: []
  responses:
    '200':
      description: Supplier deleted
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/ApiResponseString'
          example:
            success: true
            message: Supplier with ID 1 has been successfully deleted.
            data: null
    '401':
      $ref: '../openapi.yaml#/components/responses/Unauthorized'
    '403':
      $ref: '../openapi.yaml#/components/responses/Forbidden'
    '404':
      description: No supplier with that ID
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/ApiResponseError'
          example:
            success: false
            message: 'Entity not found: Supplier with ID 9 not found.'
            data: null
    '409':
      description: Deletion vetoed - open invoices still reference the supplier
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/ApiResponseError'
          example:
            success: false
            message: "Cannot delete supplier 'Acme': open invoices exist."
            data: null
