get:
  summary: Retrieve a single product by ID
  description: |
    Returns the product if it exists, otherwise 404.

    Provided for API completeness; the bundled UI reads this resource through its list endpoints.
  operationId: getProductById
  tags:
    - Products
  security:
    - BearerAuth: []
  parameters:
    - name: id
      in: path
      required: true
      description: Product identifier
      schema:
        type: integer
        format: int64
        example: 1
  responses:
    '200':
      description: Product found (ROLE_USER or ROLE_ADMIN)
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/ApiResponseProduct'
          example:
            success: true
            message: Product fetched successfully
            data:
              id: 1
              name: Laptop
              sku: SKU-A1B2C3D4
              quantity: 50
              purchasePrice: 999.99
              totalValue: 49999.50
              createdAt: '2026-01-02T03:04:00'
    '401':
      $ref: '../openapi.yaml#/components/responses/Unauthorized'
    '404':
      description: |
        No product with that ID. This endpoint builds its own 404 body rather than raising through
        the shared handler, so the message carries no `Entity not found: ` prefix.
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/ApiResponseError'
          example:
            success: false
            message: The product with ID 999 does not exist.
            data: null

delete:
  summary: Delete a product (ADMIN only)
  description: |
    Soft-deletes the product and records the deletion in the change log. The invoice module vetoes
    the deletion while the product appears on any open invoice, which surfaces as 409.
  operationId: deleteProduct
  tags:
    - Products
  security:
    - BearerAuth: []
  parameters:
    - name: id
      in: path
      required: true
      description: Product identifier
      schema:
        type: integer
        format: int64
        example: 1
  responses:
    '200':
      description: Product deleted
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/ApiResponseString'
          example:
            success: true
            message: Product with ID 1 has been successfully deleted.
            data: null
    '401':
      $ref: '../openapi.yaml#/components/responses/Unauthorized'
    '403':
      $ref: '../openapi.yaml#/components/responses/Forbidden'
    '404':
      description: No product with that ID. Built by the endpoint itself, so no prefix on the message.
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/ApiResponseError'
          example:
            success: false
            message: Cannot delete. Product with ID 999 does not exist.
            data: null
    '409':
      description: Deletion vetoed - the product appears on an open invoice
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/ApiResponseError'
          example:
            success: false
            message: "Cannot delete product 'Laptop': it appears on an open invoice."
            data: null
