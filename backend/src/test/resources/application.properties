jwt.secret=test-secret-for-unit-tests-minimum-32-chars-hs256

# This file shadows the main application.properties on the test classpath, so the
# CORS origins must be repeated here for the security filter chain to build.
app.cors.allowed-origins=http://localhost:4200,https://bestandskontrolle.vercel.app,https://stockeasefrontend.vercel.app

# Same shadowing rule: the demo properties are repeated here rather than inherited.
# Demo mode stays off by default so the suite exercises the production shape; the
# demo tests turn it on per class via @SpringBootTest(properties = ...).
app.demo.enabled=false
app.demo.reset-token=test-demo-reset-token
