spring.application.name=StockEase

# Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JWT signing secret — set JWT_SECRET in production; fallback keeps local/dev/tests working
jwt.secret=${JWT_SECRET}

# Hibernate Configuration
# WARNING: overridden to validate in application-prod.yml; must never reach production as update
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Demo mode — off everywhere by default. When true the demo module loads: a curated baseline seeded
# through the real services, a token-protected reset and a passwordless role-scoped login (ADR 005).
# When false none of those beans exist, so the /api/demo paths are not mapped at all.
app.demo.enabled=false

# Shared secret the demo reset endpoint demands in the X-Demo-Reset-Token header. Supplied by the
# environment (DEMO_RESET_TOKEN) in the demo deployment and never committed; blank closes the
# endpoint, since a token that matches nothing is the safe default for an unset secret.
app.demo.reset-token=${DEMO_RESET_TOKEN:}

# CORS: frontend origins allowed to call the API (comma-separated, no trailing slashes)
app.cors.allowed-origins=http://localhost:4200,https://bestandskontrolle.vercel.app,https://stockeasefrontend.vercel.app

# Server Configuration
server.port=8081

# Disable Open-in-View
spring.jpa.open-in-view=false

# ============================================================
# StockEase Logging Configuration — Balanced Visibility
# ============================================================

# Application logs
logging.level.com.stocks.stockease=INFO
logging.level.com.stocks.stockease.controller=INFO
logging.level.com.stocks.stockease.security=INFO

# Spring Framework (general)
logging.level.org.springframework=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.web.bind=INFO
logging.level.org.springframework.security=INFO
logging.level.org.springdoc=INFO

# Hibernate/JPA — keep SQL off by default
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=INFO
logging.level.org.hibernate.engine.jdbc.spi.SqlExceptionHelper=WARN

# Tomcat logs
logging.level.org.apache.catalina=WARN
logging.level.org.apache.coyote=WARN
logging.level.org.apache.tomcat=WARN


