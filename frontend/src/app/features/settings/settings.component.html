<div class="settings-page">
  <h1 class="settings-title">{{ 'settings.title' | translate }}</h1>

  <mat-card class="settings-card">
    <mat-card-content>
      <h2 class="settings-section-title">{{ 'settings.appearance.title' | translate }}</h2>

      <!-- The selection indicator is deliberately left on, unlike the reports page's period
           toggles: there the choice is a transient filter, here it is a stored preference and the
           reader is often on this page precisely to check what it currently is. -->
      <mat-button-toggle-group
        class="settings-theme"
        [value]="currentTheme()"
        (valueChange)="setTheme($event)"
      >
        @for (mode of themes; track mode) {
          <mat-button-toggle [value]="mode">{{ themeLabel(mode) | translate }}</mat-button-toggle>
        }
      </mat-button-toggle-group>
    </mat-card-content>
  </mat-card>

  <mat-card class="settings-card">
    <mat-card-content>
      <h2 class="settings-section-title">{{ 'common.language' | translate }}</h2>

      <mat-button-toggle-group
        class="settings-language"
        [value]="currentLang()"
        (valueChange)="setLanguage($event)"
      >
        @for (lang of languages; track lang) {
          <!-- Each language in its own name, so a reader who has landed in the wrong one can still
               find theirs; that is why these two labels are identical in both files. -->
          <mat-button-toggle [value]="lang">
            {{ 'settings.language.' + lang | translate }}
          </mat-button-toggle>
        }
      </mat-button-toggle-group>
    </mat-card-content>
  </mat-card>
</div>
