<div class="login-page">
  <mat-card class="login-card">
    <mat-card-header class="login-header">
      <mat-card-title>
        {{ 'login.title' | translate: { app: 'common.appName' | translate } }}
      </mat-card-title>
      <app-language-toggle />
      <app-theme-toggle />
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="submit()">
        <mat-form-field appearance="outline">
          <mat-label>{{ 'login.username' | translate }}</mat-label>
          <input matInput formControlName="username" autocomplete="username" />
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>{{ 'login.password' | translate }}</mat-label>
          <input
            matInput
            [type]="passwordVisible() ? 'text' : 'password'"
            formControlName="password"
            autocomplete="current-password"
          />
          <!-- type="button" is load-bearing: the default inside a form is submit, so without it
               revealing the password would post the form. Icon and label name the ACTION, as on
               the theme toggle: while the password is masked the button offers to show it. -->
          <button
            matIconButton
            matSuffix
            type="button"
            class="password-toggle"
            [attr.aria-pressed]="passwordVisible()"
            [attr.aria-label]="
              (passwordVisible() ? 'login.hidePassword' : 'login.showPassword') | translate
            "
            [title]="(passwordVisible() ? 'login.hidePassword' : 'login.showPassword') | translate"
            (click)="togglePasswordVisibility()"
          >
            <mat-icon>{{ passwordVisible() ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
        </mat-form-field>

        @if (errorKey(); as key) {
          <p class="login-error" role="alert">{{ key | translate }}</p>
        } @else if (errorMessage(); as message) {
          <!-- Rendered verbatim: this text comes from the backend envelope, which has no i18n. -->
          <p class="login-error" role="alert">{{ message }}</p>
        }

        <button matButton="filled" type="submit" [disabled]="pending()">
          {{ (pending() ? 'login.submitting' : 'login.submit') | translate }}
        </button>
      </form>
    </mat-card-content>
  </mat-card>
</div>
