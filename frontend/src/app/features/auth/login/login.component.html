<div class="login-page">
  <mat-card class="login-card">
    <mat-card-header class="login-header">
      <mat-card-title>{{ 'login.title' | translate }}</mat-card-title>
      <app-language-toggle />
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="submit()">
        <mat-form-field appearance="outline">
          <mat-label>{{ 'login.username' | translate }}</mat-label>
          <input matInput formControlName="username" autocomplete="username" />
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>{{ 'login.password' | translate }}</mat-label>
          <input
            matInput
            type="password"
            formControlName="password"
            autocomplete="current-password"
          />
        </mat-form-field>

        <!-- Rendered verbatim: this text comes from the backend envelope, which has no i18n. -->
        @if (errorMessage(); as message) {
          <p class="login-error" role="alert">{{ message }}</p>
        }

        <button matButton="filled" type="submit" [disabled]="pending()">
          {{ (pending() ? 'login.submitting' : 'login.submit') | translate }}
        </button>
      </form>
    </mat-card-content>
  </mat-card>
</div>
