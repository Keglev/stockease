<h2 mat-dialog-title>{{ titleKey | translate }}</h2>

<form [formGroup]="form" (ngSubmit)="submit()">
  <mat-dialog-content>
    <mat-form-field appearance="outline">
      <mat-label>{{ labelKey | translate }}</mat-label>
      <input matInput [type]="isPrice ? 'number' : 'text'" formControlName="value" />
      @if (form.controls.value.invalid) {
        <mat-error>{{ errorKey | translate }}</mat-error>
      }
    </mat-form-field>

    <!-- Rendered verbatim: this text comes from the backend, which has no i18n. -->
    @if (submitState.errorMessage(); as message) {
      <p class="form-error" role="alert">{{ message }}</p>
    }
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button matButton type="button" class="form-cancel" (click)="cancel()">
      {{ 'common.cancel' | translate }}
    </button>
    <button
      matButton="filled"
      type="submit"
      class="form-submit"
      [disabled]="form.invalid || submitState.pending()"
    >
      {{ 'common.save' | translate }}
    </button>
  </mat-dialog-actions>
</form>
