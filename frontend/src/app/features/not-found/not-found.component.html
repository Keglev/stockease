<div class="not-found-page">
  <header class="not-found-header">
    <app-language-toggle />
    <app-theme-toggle />
  </header>

  <main class="not-found-content">
    <mat-card class="not-found-card">
      <mat-card-content>
        <p class="not-found-code" aria-hidden="true">404</p>
        <h1 class="not-found-title">{{ 'notFound.title' | translate }}</h1>
        <p class="not-found-out-of-stock">{{ 'notFound.outOfStock' | translate }}</p>
        <p class="not-found-message">{{ 'notFound.message' | translate }}</p>

        <!-- Onward rather than inward: an unmatched URL says nothing about whether a session
             exists, so this page offers the two doors that work either way instead of a dashboard
             link that would bounce an anonymous visitor off a guard. -->
        <nav class="not-found-actions">
          <a matButton="filled" routerLink="/">{{ 'notFound.goHome' | translate }}</a>
          <a matButton="outlined" routerLink="/login">{{ 'landing.loginCta' | translate }}</a>
        </nav>
      </mat-card-content>
    </mat-card>
  </main>

  <app-footer />
</div>
