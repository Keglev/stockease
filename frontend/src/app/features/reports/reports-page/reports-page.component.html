<!-- Seven report tabs, each a toggle strip above a card that draws that tab's body. The tab ORDER
     here is load-bearing: the component addresses tabs by numeric index, and the constants it uses
     assume exactly this sequence, so moving a mat-tab reassigns which query loads on activation
     without changing a line of TypeScript. -->
<div class="reports-toolbar">
  <h1>{{ 'reports.title' | translate }}</h1>
  <button matButton="outlined" type="button" class="reports-refresh" (click)="refresh()">
    {{ 'reports.refresh' | translate }}
  </button>
</div>

@if (status.loading()) {
  <mat-progress-bar mode="indeterminate" [attr.aria-label]="'reports.loading' | translate" />
}

<!-- Rendered verbatim: this text comes from the backend envelope, which has no i18n. -->
@if (status.error(); as message) {
  <p class="reports-error" role="alert">{{ message }}</p>
}

<mat-tab-group [selectedIndex]="selectedTab()" (selectedIndexChange)="activate($event)">
  <mat-tab [label]="'reports.tabs.profit' | translate">
    <div class="tab-body">
      <!-- Placed and styled as the cash-flow tab's, so the same control reads the same way on
           both. Each one re-queries, because the window is a server-side filter. -->
      <app-period-toggle [value]="profit.period()" (selected)="profit.setPeriod($event)" />

      <app-report-view-toggle [value]="viewOf(0)" (selected)="setView(0, $event)" />

      <app-profit-card
        [view]="viewOf(0)"
        [marginOption]="profit.marginOption()"
        [profitOption]="profit.option()"
        [profitRows]="profit.sortedRows()"
        [supplierRows]="profit.sortedSupplierRows()"
        [profitColumns]="profit.columns"
        [supplierColumns]="profit.supplierColumns"
        (profitSortChange)="profit.sortBy($event)"
        (supplierSortChange)="profit.sortSuppliersBy($event)"
        (exportProfitRequested)="profit.export()"
        (exportSuppliersRequested)="profit.exportSuppliers()"
        (rowActivated)="openDetail($event)"
      />
    </div>
  </mat-tab>

  <mat-tab [label]="'reports.tabs.cashFlow' | translate">
    <div class="tab-body">
      <!-- Presets rather than a date picker is a deliberate scope decision; a custom range is
           backlog. Each one re-queries, because the window is a server-side filter. -->
      <app-period-toggle [value]="cashFlowPeriod()" (selected)="setCashFlowPeriod($event)" />

      <!-- Scopes the TIMELINE and the totals derived from it. The supplier narrows which products
           can be searched and is never sent: cash flow by supplier would be a different report from
           this one. Clearing the product returns to the whole business; the table below is
           untouched, because it already answers the per-product question in rows. -->
      <div class="search-row">
        <app-supplier-product-picker
          class="cash-flow-picker"
          [supplierSearch]="searchSuppliers"
          [productSearch]="searchCashFlowProducts"
          [supplierLabel]="supplierLabel"
          [productLabel]="productLabel"
          [productDisabled]="cashFlowSupplier() === null"
          (supplierSelected)="setCashFlowSupplier($event)"
          (productSelected)="setCashFlowProduct($event)"
        />
        <p class="search-scope">
          @if (cashFlowProduct(); as product) {
            {{ product.name }}
          } @else {
            {{ 'reports.cashFlow.allProducts' | translate }}
          }
        </p>
      </div>

      <app-cash-flow-card
        [view]="viewOf(1)"
        [option]="cashFlowOption()"
        [totals]="cashFlowTotals()"
        [filter]="cashFlowFilter()"
        [rows]="cashFlowRows()"
        [hasRows]="!!cashFlow()?.products?.length"
        [columns]="cashFlowColumns"
        (viewChange)="setView(1, $event)"
        (filterChange)="setCashFlowFilter($event)"
        (exportRequested)="exportCashFlow()"
      />
    </div>
  </mat-tab>

  <mat-tab [label]="'reports.tabs.stock' | translate">
    <div class="tab-body">
      <app-stock-card
        [view]="viewOf(2)"
        [option]="stock.option()"
        [totals]="stock.totals()"
        [filter]="stock.filter()"
        [rows]="stock.filteredRows()"
        [hasRows]="stock.rows().length > 0"
        [columns]="stock.columns"
        (viewChange)="setView(2, $event)"
        (filterChange)="stock.setFilter($event)"
        (sortChange)="stock.sortBy($event)"
        (exportRequested)="stock.export()"
      />
    </div>
  </mat-tab>

  <mat-tab [label]="'reports.tabs.losses' | translate">
    <div class="tab-body">
      <!-- Placed and styled as the other period toggles. Write-offs count on the date they were
           booked, so this reads movement dates like the profit tab rather than payment dates. -->
      <app-period-toggle [value]="losses.period()" (selected)="losses.setPeriod($event)" />

      <app-losses-card
        [view]="viewOf(3)"
        [option]="losses.option()"
        [totals]="losses.totals()"
        [filter]="losses.filter()"
        [rows]="losses.filteredRows()"
        [hasRows]="losses.rows().length > 0"
        [columns]="losses.columns"
        [remarkRows]="losses.remarkRows()"
        (viewChange)="setView(3, $event)"
        (filterChange)="losses.setFilter($event)"
        (sortChange)="losses.sortBy($event)"
        (exportRequested)="losses.export()"
      />
    </div>
  </mat-tab>

  <mat-tab [label]="'reports.tabs.dueDates' | translate">
    <div class="tab-body">
      <!-- 'list' rather than 'table': this tab's other half is two navigation lists over
           invoices, not a dataset. -->
      <app-report-view-toggle
        [value]="viewOf(4)"
        tableLabelKey="reports.view.list"
        (selected)="setView(4, $event)"
      />

      <app-due-dates-card
        [view]="viewOf(4)"
        [option]="due.option()"
        [dueSoonRows]="due.dueSoonRows()"
        [overdueRows]="due.overdueRows()"
      />
    </div>
  </mat-tab>

  <mat-tab [label]="'reports.tabs.changes' | translate">
    <div class="tab-body">
      <!-- No Chart|Table toggle here, and deliberately: a log is a sequence of individual events,
           and every aggregation that would make a chart of it - changes per day, per field, per
           person - answers a question nobody brought to an audit trail. The table is the report. -->
      <app-period-toggle [value]="changes.period()" (selected)="changes.setPeriod($event)" />

      <app-changes-card
        [filter]="changes.filter()"
        [user]="changes.user()"
        [usernames]="changes.usernames()"
        [rows]="changes.filteredRows()"
        [hasRows]="changes.rows().length > 0"
        [columns]="changes.columns"
        (filterChange)="changes.setFilter($event)"
        (userChange)="changes.setUser($event)"
        (exportRequested)="changes.export()"
      />
    </div>
  </mat-tab>

  <mat-tab [label]="'reports.tabs.analytics' | translate">
    <div class="tab-body">
      <!-- Charts only, and no CSV: these are two derived series, and the rows behind them are
           already exportable elsewhere - the price changes in the Changes tab, the movements in the
           movement ledger. A download here would duplicate both. -->
      <!-- Supplier first, then that supplier's products, then an explicit ask. The supplier narrows
           the search and is never sent: these two series are a product's own history, which no
           supplier scopes. -->
      <div class="search-row">
        <app-supplier-product-picker
          class="analytics-picker"
          [supplierSearch]="searchSuppliers"
          [productSearch]="searchAnalyticsProducts"
          [supplierLabel]="supplierLabel"
          [productLabel]="productLabel"
          [productDisabled]="analyticsSupplier() === null"
          (supplierSelected)="setAnalyticsSupplier($event)"
          (productSelected)="setAnalyticsProduct($event)"
        />
        <button
          matButton="filled"
          type="button"
          class="analytics-show"
          [disabled]="!canShowAnalytics()"
          (click)="showAnalytics()"
        >
          {{ 'reports.analytics.show' | translate }}
        </button>
      </div>

      <app-period-toggle [value]="analyticsPeriod()" (selected)="setAnalyticsPeriod($event)" />

      <app-analytics-card
        [shown]="analyticsShownProductId() !== null"
        [priceOption]="analyticsPriceOption()"
        [stockOption]="analyticsStockOption()"
      />
    </div>
  </mat-tab>
</mat-tab-group>
