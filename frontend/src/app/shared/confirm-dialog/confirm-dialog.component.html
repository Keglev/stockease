<h2 mat-dialog-title class="confirm-title">{{ data.titleKey | translate }}</h2>

<mat-dialog-content>
  <p class="confirm-message">{{ data.messageKey | translate: data.messageParams }}</p>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button matButton type="button" class="confirm-cancel" (click)="cancel()">
    {{ 'common.cancel' | translate }}
  </button>
  <button matButton="filled" type="button" class="confirm-accept" (click)="confirm()">
    {{ 'common.confirm' | translate }}
  </button>
</mat-dialog-actions>
