# =============================================================================
# lychee.toml — link checker settings for the built docs site
#
# Used by the "Check internal links" step in .github/workflows/docs-pipeline.yml,
# which runs lychee against target/docs after the site is built and before it is
# uploaded. Settings live here rather than in the workflow for the same reason the
# build steps live in .github/scripts/docs/: the list has reasons attached, and
# reasons do not survive being flattened into a YAML `run:` line.
#
# `--root-dir` is NOT set here: it has to be an absolute path, which differs
# between a runner and a laptop, so the workflow computes it at runtime.
# =============================================================================

# Internal links only. External URLs are never requested: third-party rate limits
# and outages would turn an unrelated site being down into a red docs build, and
# nothing here can fix a link on someone else's server anyway. Checking them is a
# separate, scheduled concern - deliberately out of scope for this gate.
offline = true

# Every link must resolve. Without this a 404 target would still count as reachable.
require_https = false

# Fail on the first pass; no retry loop is meaningful for filesystem lookups.
max_retries = 0

no_progress = true

# ---------------------------------------------------------------------------
# Exclusions — the three report trees that are legitimately absent from a docs
# build and present on the deployed site.
#
# None of the three is generated by build-docs.sh. Each is produced by a *test*
# workflow, uploaded as an artifact, and copied into place only on the docs run
# that the matching workflow triggered:
#
#   Backend Tests  -> JaCoCo HTML          -> /stockease/backend/coverage/
#   Frontend Tests -> Vitest coverage HTML -> /stockease/frontend/coverage/
#   Frontend Tests -> TypeDoc reference    -> /stockease/frontend/api/
#
# So any single run has at most one of them, a `docs/**` push has none, and a
# local build has none - while the deployed site has all three, because the
# deploy workflow preserves the reports a given build did not regenerate.
# Checking them here would fail every run for a link that is live in production.
#
# These are path prefixes, matched against the resolved target, so they hold
# whether a page wrote the link site-absolute or relative.
# ---------------------------------------------------------------------------
exclude = [
  # JaCoCo report — published by the Backend Tests workflow's artifact.
  "/stockease/backend/coverage/",

  # Vitest V8 coverage report — published by the Frontend Tests workflow's artifact.
  "/stockease/frontend/coverage/",

  # TypeDoc API reference — built in frontend CI (it needs the frontend's
  # node_modules, which the docs pipeline does not install) and published from
  # that workflow's artifact.
  "/stockease/frontend/api/",
]
